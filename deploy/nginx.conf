# PRAUS landing — nginx
#
# ATENÇÃO: o VPS de produção (srv1881911.hstgr.cloud) usa **Caddy**, não nginx.
# Para aquele servidor, use deploy/Caddyfile. Este arquivo fica como alternativa
# caso a landing seja hospedada em algum lugar baseado em nginx.
#
# Serve os arquivos estáticos e faz proxy de /api para o serviço Node.
# Mesmo domínio para os dois: sem CORS, sem certificado extra.
#
# Instalar:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/praus-landing
#   sudo ln -s /etc/nginx/sites-available/praus-landing /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SEU_DOMINIO -d www.SEU_DOMINIO

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;

    # o certbot injeta o redirect para HTTPS aqui
    root /var/www/praus-landing;
    index index.html;

    charset utf-8;
    client_max_body_size 16k;      # a landing só recebe um JSON minúsculo

    # ---- Segurança ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- API ----
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # a exportação nunca deve ser cacheada por proxy/CDN
    location = /api/waitlist/export {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # ---- Estáticos ----
    # Vídeos e imagens são versionados por conteúdo raramente; cache longo.
    location ~* \.(mp4|webm|jpg|jpeg|png|webp|avif|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML/CSS/JS precisam revalidar para um deploy aparecer na hora
    location ~* \.(html|css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
