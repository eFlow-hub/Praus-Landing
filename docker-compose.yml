# Landing PRAUS — stack própria, isolada da plataforma.
#
# Por que Postgres próprio e não o da plataforma: praus.online hoje roda o
# ambiente `homolog`. Os e-mails da waitlist são dado REAL de produção, e um
# `docker compose down -v` ou um `restore.sh --live` na homologação levaria os
# leads junto. Volume separado = reset de homolog nunca encosta neles.
#
# Superfície de rede (mesma regra da infra da plataforma): NENHUMA porta
# publicada. O Postgres só existe na rede interna; o serviço `landing` também
# entra na rede do Caddy da plataforma, que é quem termina TLS na 80/443.
#
# Subir:
#   docker compose --env-file .env up -d --build
name: ${COMPOSE_PROJECT_NAME:-praus-landing}

services:
  # NÃO chamar de `postgres`: o serviço `landing` também entra na rede da
  # plataforma, que já tem um serviço com esse nome. O DNS do Docker resolveria
  # `postgres` para o banco da homolog e a autenticação falharia.
  landing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  landing:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@landing-db:5432/${POSTGRES_DB}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_TO: ${MAIL_TO}
      EXPORT_TOKEN: ${EXPORT_TOKEN}
      WAITLIST_LIMIT: ${WAITLIST_LIMIT:-1200}
      RATE_LIMIT: ${RATE_LIMIT:-12}
    depends_on:
      landing-db:
        condition: service_healthy
    networks:
      interna:
      # rede do Caddy da plataforma — é assim que o proxy alcança este serviço
      plataforma:
        aliases:
          - landing

networks:
  interna:
  plataforma:
    external: true
    name: ${PLATAFORMA_NETWORK:-praus-homolog_default}

volumes:
  postgres-data:
